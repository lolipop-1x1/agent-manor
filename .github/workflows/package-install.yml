name: npm package installation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:cli
      - run: node -e "require('node:fs').mkdirSync('.local/package', {recursive:true})"
      - run: npm pack --pack-destination .local/package
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: .local/package/*.tgz
          if-no-files-found: error
  install:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
          - runner: ubuntu-24.04-arm
            architecture: arm64
          - runner: ubuntu-24.04
            architecture: x64
          - runner: windows-2025
            architecture: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: ${{ matrix.architecture }}
          registry-url: https://registry.npmjs.org/
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: .local/package
      - name: Install and exercise the same product tarball
        shell: bash
        run: npm run test:package -- .local/package/*.tgz
